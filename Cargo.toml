[package]
name = "lau-tile-store"
version = "0.1.0"
edition = "2021"
description = "SQLite-backed tile persistence layer for agent systems"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
